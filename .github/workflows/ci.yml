# Packaging CI (D5 + D6 + HZ-018 + HZ-049 + HZ-050 + HZ-051 + HZ-052). Actions pinned to commit SHAs.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  spike-docs:
    name: spike-docs (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: D5 spike check
        run: python scripts/check_d5.py

      - name: D6 spike check
        run: python scripts/check_d6.py

      - name: HZ-018 uninstall restore hooks
        run: python scripts/check_hz018.py

      - name: HZ-049 Windows MSI/NSIS packaging gates
        run: python scripts/check_hz049.py

      - name: HZ-050 Linux Flatpak/AppImage/deb/rpm/AUR gates
        run: python scripts/check_hz050.py

      - name: HZ-051 macOS DMG + Homebrew cask gates
        run: python scripts/check_hz051.py

      - name: HZ-052 release metadata -> website feed
        run: python scripts/check_hz052.py
